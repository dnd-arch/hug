<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8e8ed" />
  <title>عناقنا الصغير</title>
  <style>
    :root{--ink:#522f40;--muted:#876574;--rose:#d96c8d;--rose-dark:#ad4e70;--cream:#fff8f7;--glass:rgba(255,250,250,.72);--line:rgba(160,88,117,.18);--ease:cubic-bezier(.23,1,.32,1)}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:"Trebuchet MS","Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);background:#f8e8ed} body{min-height:100vh;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(255,250,250,.18),rgba(255,242,247,.42)),url("images/background.png") center/cover no-repeat;filter:saturate(.95)}
    body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.5),transparent 32%),linear-gradient(180deg,transparent 55%,rgba(114,48,80,.13))}
    button{font:inherit;border:0;cursor:pointer;color:inherit} .hidden{display:none!important}
    .app{min-height:100vh;display:grid;place-items:center;padding:18px}.shell{width:min(100%,1050px);min-height:min(760px,calc(100vh - 36px));display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding:clamp(18px,4vw,42px);border:1px solid rgba(255,255,255,.66);border-radius:34px;background:rgba(255,250,251,.31);box-shadow:0 22px 70px rgba(105,50,75,.14),inset 0 1px rgba(255,255,255,.7);backdrop-filter:blur(8px)}
    .identity{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:linear-gradient(140deg,rgba(255,248,250,.82),rgba(244,218,229,.76));backdrop-filter:blur(10px)}.identity-card{width:min(100%,430px);text-align:center;padding:42px 24px;border-radius:30px;background:rgba(255,255,255,.7);box-shadow:0 22px 70px rgba(110,48,78,.16);border:1px solid rgba(255,255,255,.8)}.eyebrow{font-size:.78rem;letter-spacing:.16em;color:var(--rose-dark);margin-bottom:14px}.identity h1{font-size:clamp(2.1rem,7vw,3.4rem);margin:0 0 28px;font-weight:700}.identity-actions{display:grid;gap:12px}.identity-actions button,.action,.reset,.music{min-height:52px;padding:12px 20px;border-radius:999px;background:linear-gradient(135deg,#e98aa5,#c95f83);color:white;box-shadow:0 10px 24px rgba(185,73,111,.2);transition:transform .16s var(--ease),box-shadow .16s var(--ease),filter .16s}.identity-actions button:last-child{background:linear-gradient(135deg,#d47ca4,#b95f8a)}button:hover{filter:brightness(1.04);box-shadow:0 13px 28px rgba(185,73,111,.27)}button:active{transform:scale(.97)}button:focus-visible{outline:3px solid rgba(185,73,111,.4);outline-offset:3px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 8px 20px rgba(112,58,82,.12);font-size:1.35rem}.brand h2{margin:0;font-size:clamp(1rem,3vw,1.3rem)}.brand small{display:block;color:var(--muted);font-size:.72rem;margin-top:3px}.counter{text-align:center;padding:10px 15px;border-radius:18px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.55);min-width:122px}.counter-label{display:block;font-size:.72rem;color:var(--muted);white-space:nowrap}.counter strong{display:block;font-size:1.45rem;line-height:1.1;margin-top:2px}.tools{display:flex;align-items:center;gap:8px}.subtle{font-size:.72rem;color:var(--muted);background:transparent;padding:7px;border-radius:10px}.subtle:hover{background:rgba(255,255,255,.5);box-shadow:none}
    .status{text-align:center;min-height:28px;color:var(--muted);font-size:.85rem}.status b{color:var(--rose-dark)}
    .scene{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:370px}.characters{width:100%;display:grid;grid-template-columns:1fr 1fr;align-items:end;gap:clamp(8px,5vw,70px);max-width:820px;direction:ltr}.character{text-align:center;min-width:0;position:relative;direction:rtl}.character-figure{height:clamp(220px,43vw,390px);display:flex;align-items:flex-end;justify-content:center;transition:transform 1.35s var(--ease),filter 1.35s var(--ease)}.character img{display:block;max-width:100%;width:auto;height:100%;object-fit:contain;filter:drop-shadow(0 17px 13px rgba(104,44,71,.13))}.character-ikramo .character-figure img{height:88.65%;}.character-name{margin-top:7px;font-weight:700;font-size:clamp(.9rem,2.4vw,1.1rem)}.message{min-height:28px;margin:7px auto 0;padding:7px 11px;width:max-content;max-width:100%;border-radius:13px;color:#a54e6f;background:rgba(255,255,255,.62);font-size:clamp(.72rem,2vw,.9rem);opacity:0;transform:translateY(6px) scale(.98);transition:opacity .45s var(--ease),transform .45s var(--ease),box-shadow .45s}.message.visible{opacity:1;transform:translateY(0) scale(1);box-shadow:0 8px 22px rgba(188,82,119,.12)}.transitioning .character-ikramo .character-figure{transform:translateX(17%) scale(1.05);filter:drop-shadow(0 0 24px rgba(238,143,170,.46))}.transitioning .character-imado .character-figure{transform:translateX(-17%) scale(1.05);filter:drop-shadow(0 0 24px rgba(238,143,170,.46))}.final-hug{display:grid;place-items:center;width:100%;position:relative;animation:finalIn .9s var(--ease) both}.final-hug img{width:min(78vw,590px);max-height:57vh;object-fit:contain;filter:drop-shadow(0 18px 25px rgba(105,42,71,.18)) drop-shadow(0 0 25px rgba(255,196,211,.55))}.stickers{position:absolute;inset:3% 6%;pointer-events:none}.sticker{position:absolute;width:clamp(42px,10vw,100px);max-width:22%;opacity:0;animation:stickerIn .7s var(--ease) forwards,float 4s ease-in-out infinite alternate}.sticker img{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 8px rgba(110,48,77,.15))}.heart{position:absolute;opacity:0;color:#d97595;animation:drift 2.3s ease-out forwards;font-size:clamp(1rem,3vw,1.5rem);pointer-events:none}
    .controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;min-height:55px}.action{font-size:clamp(.85rem,2.5vw,1rem)}.reset,.music{background:rgba(255,255,255,.62);color:var(--rose-dark);border:1px solid rgba(177,91,122,.17);box-shadow:none;font-size:.86rem}.music{background:rgba(212,102,139,.13)}.connection{font-size:.7rem;color:var(--muted);text-align:center}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#dba0b4;margin-inline-end:5px}.dot.ok{background:#76ad8c}
    @keyframes finalIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}@keyframes stickerIn{from{opacity:0;transform:scale(.88) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}@keyframes float{to{transform:translateY(-6px) rotate(2deg)}}@keyframes drift{0%{opacity:0;transform:translateY(16px) scale(.8)}30%{opacity:.8}100%{opacity:0;transform:translateY(-70px) scale(1.1)}}
    @media (max-width:600px){.app{padding:9px}.shell{min-height:calc(100vh - 18px);border-radius:25px;padding:16px 13px;gap:10px}.counter{min-width:104px;padding:8px 10px}.counter-label{font-size:.65rem}.counter strong{font-size:1.25rem}.brand-mark{width:36px;height:36px}.brand small{font-size:.64rem}.scene{min-height:330px}.characters{gap:0}.character-figure{height:clamp(190px,52vw,280px)}.character-name{font-size:.83rem}.message{font-size:.68rem;padding:6px 7px}.final-hug img{width:min(92vw,500px);max-height:52vh}.stickers{inset:3% 0}.tools{gap:2px}.subtle{font-size:.65rem;padding:4px}}
    @media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div id="identity" class="identity"><div class="identity-card"><div class="eyebrow">عناقنا الصغير</div><h1>هل أنت؟</h1><div class="identity-actions"><button data-role="imado">عمادو ❤️</button><button data-role="ikramo">إكرامو ❤️</button></div></div></div>
  <main id="app" class="app hidden"><section class="shell">
    <header><div class="brand"><div class="brand-mark">♡</div><div><h2>عمادو و إكرامو</h2><small>مكان صغير لعناق كبير</small></div></div><div class="tools"><div class="counter"><span class="counter-label">عدد العناقات ❤️</span><strong id="hugCount">0</strong></div><button id="changeRole" class="subtle" title="تغيير الهوية">تغيير</button></div></header>
    <div id="status" class="status">نجهّز مكان العناق…</div>
    <section id="scene" class="scene"><div id="characters" class="characters"><article class="character character-ikramo"><div class="character-figure"><img id="ikramoImg" alt="إكرامو" /></div><div class="character-name">إكرامو</div><div id="ikramoMessage" class="message"></div></article><article class="character character-imado"><div class="character-figure"><img id="imadoImg" alt="عمادو" /></div><div class="character-name">عمادو</div><div id="imadoMessage" class="message"></div></article></div><div id="finalHug" class="final-hug hidden"><img src="" alt="عمادو وإكرامو يتعانقان" /><div id="stickers" class="stickers"></div></div></section>
    <div id="controls" class="controls"></div><div class="connection"><span id="connectionDot" class="dot"></span><span id="connectionText">جارِ الاتصال</span></div>
  </section></main>
  <audio id="music" preload="auto" loop></audio>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script>
    /* ===================== CONFIGURATION: edit only this section ===================== */
    const assets={ikramoSad:"images/ikramo-sad.png",imadoSad:"images/imado-sad.png",ikramoHug:"images/ikramo-hug.png",imadoHug:"images/imado-hug.png",bothHugging:"images/both-hugging.png",background:"images/background.png",stickers:["stickers/sticker-1.png","stickers/sticker-2.png","stickers/sticker-3.png","stickers/sticker-4.png","stickers/sticker-5.png","stickers/sticker-6.png"],music:"audio/love-song.mp3"};
    const ROOM_ID="our-private-hug-room";
    const firebaseConfig={apiKey:"AIzaSyDU0LDQ7ryHD9bvr5CsPgd7ehJw7Qf-H0s",authDomain:"hugg-b218f.firebaseapp.com",databaseURL:"https://hugg-b218f-default-rtdb.europe-west1.firebasedatabase.app/",projectId:"hugg-b218f",storageBucket:"hugg-b218f.firebasestorage.app",messagingSenderId:"897406135611",appId:"1:897406135611:web:955b959f0a77ffac97db1e",measurementId:"G-4CX9E0NNG7"};
    /* ================================================================================ */
    const $=id=>document.getElementById(id), path=`rooms/${ROOM_ID}`, defaultState={ikramoWantsHug:false,imadoWantsHug:false,stage:"waiting",hugCount:0,activeHugId:null,stickerLayout:null,countedHugId:null,updatedAt:0};
    let role=localStorage.getItem("hug-role"), uid=null, db=null, state={...defaultState}, transitionTimer=null, renderedCycle=null, musicStartedFor=null, lastFinalized=null, requestBusy=false;
    const params=new URLSearchParams(location.search); if(params.get("user")==="imado"||params.get("user")==="ikramo") role=params.get("user");
    function chooseRole(next){role=next;localStorage.setItem("hug-role",role);$("identity").classList.add("hidden");$("app").classList.remove("hidden");start()}
    document.querySelectorAll("[data-role]").forEach(b=>b.addEventListener("click",()=>chooseRole(b.dataset.role)));
    $("changeRole").addEventListener("click",()=>{localStorage.removeItem("hug-role");location.href=location.pathname});
    function setConnection(ok,text){$("connectionDot").classList.toggle("ok",ok);$("connectionText").textContent=text}
    function setStatus(html){$("status").innerHTML=html}
    function safeState(v){return Object.assign({},defaultState,v||{})}
    function randomId(){return `${Date.now()}-${Math.random().toString(36).slice(2,9)}`}
    function stickerLayout(){return assets.stickers.map((src,i)=>({src,x:[5,78,1,88,15,70][i]+(Math.random()*8-4),y:[7,8,42,43,73,75][i]+(Math.random()*7-3),r:Math.round(Math.random()*28-14),s:Number((.82+Math.random()*.28).toFixed(2))}))}
    function updateControls(){const c=$("controls");c.innerHTML="";if(state.stage==="hugging"||state.stage==="completed"){const reset=document.createElement("button");reset.className="reset";reset.textContent="نرجع ننتظر ❤️";reset.onclick=resetCycle;c.append(reset)}else{const b=document.createElement("button");b.className="action";b.textContent=requestBusy?"جارِ إرسال العناق…":role==="ikramo"?"ارواح عندي كيوتي ❤️":"ارواحي عندي حبوبتي ❤️";b.onclick=sendRequest;b.disabled=requestBusy||!db||!uid||((role==="ikramo"&&state.ikramoWantsHug)||(role==="imado"&&state.imadoWantsHug));c.append(b)}if($("music").paused&&state.stage==="hugging"){const m=document.createElement("button");m.className="music";m.textContent="شغّل الأغنية ❤️";m.onclick=()=>playMusic(true);c.append(m)}}
    function render(){state=safeState(state);$("hugCount").textContent=String(state.hugCount||0);const final=state.stage==="hugging"||state.stage==="completed";$("characters").classList.toggle("hidden",final);$("finalHug").classList.toggle("hidden",!final);$("scene").classList.toggle("transitioning",state.stage==="transitioning");if(!final){$("ikramoImg").src=state.ikramoWantsHug?assets.ikramoHug:assets.ikramoSad;$("imadoImg").src=state.imadoWantsHug?assets.imadoHug:assets.imadoSad;const im=$("ikramoMessage"),mm=$("imadoMessage");im.textContent="ارواح عندي كيوتي ❤️";mm.textContent="ارواحي عندي حبوبتي ❤️";im.classList.toggle("visible",state.ikramoWantsHug);mm.classList.toggle("visible",state.imadoWantsHug)}else{const img=$("finalHug").querySelector("img");img.src=assets.bothHugging;renderStickers();if(musicStartedFor!==state.activeHugId){musicStartedFor=state.activeHugId;playMusic(false)}}updateControls();if(state.stage==="transitioning"&&renderedCycle!==state.activeHugId){renderedCycle=state.activeHugId;clearTimeout(transitionTimer);transitionTimer=setTimeout(()=>finalizeHug(state.activeHugId),1500)}setStatus(state.stage==="waiting"?"كل واحد ينتظر إشارة حلوة من الثاني…":state.stage==="transitioning"?"قربوا من بعض… العناق جاي ❤️":final?"تم العناق، يا أحلى اثنين ❤️":"لحظة حلوة بدأت…")}
    function renderStickers(){const box=$("stickers");box.innerHTML="";if(!state.stickerLayout)return;state.stickerLayout.forEach((s,i)=>{const el=document.createElement("div");el.className="sticker";el.style.left=`${s.x}%`;el.style.top=`${s.y}%`;el.style.transform=`rotate(${s.r}deg) scale(${s.s})`;el.style.animationDelay=`${i*75}ms`;el.innerHTML=`<img src="${s.src}" alt="" />`;box.append(el)})}
    function sprinkle(){for(let i=0;i<7;i++){const h=document.createElement("span");h.className="heart";h.textContent=i%2?"✦":"♡";h.style.left=`${25+Math.random()*50}%`;h.style.top=`${35+Math.random()*30}%`;h.style.animationDelay=`${i*90}ms`;$("scene").append(h);setTimeout(()=>h.remove(),2500)}}
    async function sendRequest(){if(!db||!uid||requestBusy)return;const key=role==="ikramo"?"ikramoWantsHug":"imadoWantsHug";if(state[key])return;requestBusy=true;updateControls();try{const result=await db.ref(path).transaction(current=>{const next=safeState(current);if(next[key])return;next[key]=true;next.stage=next.ikramoWantsHug&&next.imadoWantsHug?"both_requested":"one_requested";next.updatedAt=Date.now();return next});if(!result.committed)throw new Error("لم يتم حفظ الطلب، حاول مرة أخرى")}catch(err){console.error(err);setStatus(`لم يُرسل الطلب. ${err.code==="PERMISSION_DENIED"?"تأكد من نشر قواعد Firebase الجديدة.":"تحقق من الاتصال ثم حاول مرة أخرى."}`)}finally{requestBusy=false;updateControls()}}
    async function beginTransition(s){const ref=db.ref(path);let claimed=false;await ref.transaction(current=>{if(!current||current.stage!=="both_requested"||!current.ikramoWantsHug||!current.imadoWantsHug||current.activeHugId)return current;claimed=true;return {...current,stage:"transitioning",activeHugId:randomId(),stickerLayout:stickerLayout(),updatedAt:Date.now()}});if(claimed)sprinkle()}
    async function finalizeHug(id){if(!id||lastFinalized===id)return;lastFinalized=id;const ref=db.ref(path);await ref.transaction(current=>{if(!current||current.activeHugId!==id||!current.ikramoWantsHug||!current.imadoWantsHug)return current;if(current.countedHugId===id)return current;return {...current,stage:"hugging",countedHugId:id,hugCount:Number(current.hugCount||0)+1,updatedAt:Date.now()}})}
    async function resetCycle(){if(!db)return;lastFinalized=null;musicStartedFor=null;$("music").pause();$("music").currentTime=0;await db.ref(path).update({ikramoWantsHug:false,imadoWantsHug:false,stage:"waiting",activeHugId:null,stickerLayout:null,countedHugId:null,updatedAt:firebase.database.ServerValue.TIMESTAMP})}
    function playMusic(manual){const a=$("music");a.src=assets.music;a.loop=true;const p=a.play();if(p&&p.catch)p.catch(()=>{if(manual)setStatus("اضغطي على زر الأغنية مرة ثانية ❤️")})}
    function subscribe(){const ref=db.ref(path);ref.on("value",snap=>{const incoming=snap.val();if(!incoming){ref.set({...defaultState,updatedAt:firebase.database.ServerValue.TIMESTAMP});return}const next=safeState(incoming);if(next.ikramoWantsHug&&next.imadoWantsHug&&next.stage!=="transitioning"&&next.stage!=="hugging"&&next.stage!=="completed"){beginTransition(next);return}state=next;render()});db.ref(".info/connected").on("value",s=>setConnection(!!s.val(),s.val()?"متصلان معًا":"بانتظار الاتصال…"))}
    async function start(){if(!role){$("identity").classList.remove("hidden");$("app").classList.add("hidden");return}try{if(firebaseConfig.apiKey.startsWith("PASTE_"))throw new Error("Firebase config missing");if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);db=firebase.database();const cred=await firebase.auth().signInAnonymously();uid=cred.user.uid;const pRef=db.ref(`${path}/participants/${uid}`);const existing=(await pRef.once("value")).val();if(existing&&existing!==role)throw new Error("هذا الجهاز مرتبط بالهوية الأخرى");if(!existing)await pRef.set(role);subscribe()}catch(err){console.error(err);setConnection(false,"تعذّر الاتصال بـ Firebase");let message="تأكد من نشر آخر نسخة من index.html.";if(err.code==="auth/operation-not-allowed")message="فعّل Anonymous من Firebase → Authentication → Sign-in method.";else if(err.code==="PERMISSION_DENIED"||err.code==="database/permission-denied")message="الصق قواعد Realtime Database الصحيحة ثم أعد تحميل الصفحة.";else if(err.message==="Firebase config missing")message="أضف إعدادات Firebase داخل CONFIGURATION.";else if(err.message==="هذا الجهاز مرتبط بالهوية الأخرى")message="هذا الجهاز محفوظ على هوية أخرى؛ اضغط تغيير واختر الهوية الصحيحة.";setStatus(`${message} <small style="display:block;margin-top:5px;opacity:.72">${err.code?`رمز الخطأ: ${err.code}`:""}</small>`);render()}}
    if(role){$("identity").classList.add("hidden");$("app").classList.remove("hidden");start()}else{$("identity").classList.remove("hidden")}
  </script>
</body>
</html>

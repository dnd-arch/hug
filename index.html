    function render(){state=safeState(state);$("hugCount").textContent=String(state.hugCount||0);renderHistory();renderPresence();renderTimer();const final=state.stage==="hugging"||state.stage==="completed";$("characters").classList.toggle("hidden",final);$("finalHug").classList.toggle("hidden",!final);$("scene").classList.toggle("transitioning",state.stage==="transitioning");$("scene").classList.toggle("is-final",final);if(!final){$("ikramoImg").src=state.ikramoWantsHug?assets.ikramoHug:assets.ikramoSad;$("imadoImg").src=state.imadoWantsHug?assets.imadoHug:assets.imadoSad;const im=$("ikramoMessage"),mm=$("imadoMessage");im.textContent="ارواح عندي كيوتي ❤️";mm.textContent="ارواحي عندي حبوبتي ❤️";im.classList.toggle("visible",state.ikramoWantsHug);mm.classList.toggle("visible",state.imadoWantsHug)}else{const img=$("finalHug").querySelector("img");img.src=assets.bothHugging;renderStickers();if(musicStartedFor!==state.activeHugId){musicStartedFor=state.activeHugId;playMusic(false)}}updateControls();if(state.stage==="transitioning"&&renderedCycle!==state.activeHugId){renderedCycle=state.activeHugId;clearTimeout(transitionTimer);transitionTimer=setTimeout(()=>finalizeHug(state.activeHugId),1500)}setStatus(state.stage==="waiting"?"كل واحد ينتظر إشارة حلوة من الثاني…":state.stage==="transitioning"?"قربوا من بعض… العناق جاي ❤️":final?"تم العناق، يا أحلى اثنين ❤️":"لحظة حلوة بدأت…")}
    function renderStickers(){const box=$("stickers");box.innerHTML="";if(!state.stickerLayout)return;state.stickerLayout.forEach((s,i)=>{const el=document.createElement("div");el.className="sticker draggable";el.style.left=`${s.x}%`;el.style.top=`${s.y}%`;el.style.transform=`rotate(${s.r}deg) scale(${s.s})`;el.style.animationDelay=`${i*75}ms`;el.innerHTML=`<img src="${s.src}" alt="" />`;bindStickerDrag(el,i,box);box.append(el)})}
    function bindStickerDrag(el,index,box){let dragging=false,moved=false;const move=event=>{if(!dragging)return;event.preventDefault();moved=true;const rect=box.getBoundingClientRect(),x=Math.max(0,Math.min(94,((event.clientX-rect.left)/rect.width)*100)),y=Math.max(0,Math.min(90,((event.clientY-rect.top)/rect.height)*100));state.stickerLayout[index].x=x;state.stickerLayout[index].y=y;el.style.left=`${x}%`;el.style.top=`${y}%`;el.style.transform=`rotate(${state.stickerLayout[index].r}deg) scale(${state.stickerLayout[index].s})`};const end=async()=>{if(!dragging)return;dragging=false;el.classList.remove("dragging");window.removeEventListener("pointermove",move);if(moved&&db){try{await db.ref(`${path}/stickerLayout`).set(state.stickerLayout)}catch(err){console.error("Sticker position save failed",err)}}};el.addEventListener("pointerdown",event=>{if(state.stage!=="hugging"&&state.stage!=="completed")return;event.preventDefault();dragging=true;moved=false;el.classList.add("dragging");window.addEventListener("pointermove",move,{passive:false});window.addEventListener("pointerup",end,{once:true})})}
    function sprinkle(){for(let i=0;i<7;i++){const h=document.createElement("span");h.className="heart";h.textContent=i%2?"✦":"♡";h.style.left=`${25+Math.random()*50}%`;h.style.top=`${35+Math.random()*30}%`;h.style.animationDelay=`${i*90}ms`;$("scene").append(h);setTimeout(()=>h.remove(),2500)}}
    async function sendRequest(){if(!db||!uid||requestBusy)return;const key=role==="ikramo"?"ikramoWantsHug":"imadoWantsHug";if(state[key])return;requestBusy=true;updateControls();try{const patch={};patch[key]=true;patch.stage=state.ikramoWantsHug||state.imadoWantsHug?"both_requested":"one_requested";patch.updatedAt=Date.now();await db.ref(path).update(patch);state[key]=true;state.stage=patch.stage;render()}catch(err){console.error(err);setStatus(`لم يُرسل الطلب. ${err.code==="PERMISSION_DENIED"?"انشر قواعد Firebase المتوافقة الجديدة.":"تحقق من الاتصال ثم حاول مرة أخرى."}`)}finally{requestBusy=false;updateControls()}}
    async function beginTransition(s){const ref=db.ref(path);let claimed=false;await ref.transaction(current=>{if(!current||current.stage!=="both_requested"||!current.ikramoWantsHug||!current.imadoWantsHug||current.activeHugId)return current;claimed=true;return {...current,stage:"transitioning",activeHugId:randomId(),stickerLayout:stickerLayout(),updatedAt:Date.now()}});if(claimed)sprinkle()}
    async function finalizeHug(id){if(!id||lastFinalized===id)return;lastFinalized=id;const ref=db.ref(path);await ref.transaction(current=>{if(!current||current.activeHugId!==id||!current.ikramoWantsHug||!current.imadoWantsHug)return current;if(current.countedHugId===id)return current;const now=Date.now(), nextCount=Number(current.hugCount||0)+1, history={...(current.milestoneHistory||{})};if(milestoneTargets.includes(nextCount)&&!history[String(nextCount)])history[String(nextCount)]={date:formatDate(now),hugCount:nextCount};return {...current,stage:"hugging",countedHugId:id,hugCount:nextCount,hugStartedAt:now,milestoneHistory:history,updatedAt:now}})}
    async function resetCycle(){if(!db)return;lastFinalized=null;musicStartedFor=null;$("music").pause();$("music").currentTime=0;const elapsed=state.hugStartedAt?Math.max(0,Math.floor((Date.now()-Number(state.hugStartedAt))/1000)):0;const record=Math.max(Number(state.longestHugSeconds||0),elapsed);await db.ref(path).update({ikramoWantsHug:false,imadoWantsHug:false,stage:"waiting",activeHugId:null,stickerLayout:null,countedHugId:null,hugStartedAt:null,longestHugSeconds:record,updatedAt:firebase.database.ServerValue.TIMESTAMP})}
    function playMusic(manual){const a=$("music");a.src=assets.music;a.loop=true;const p=a.play();if(p&&p.catch)p.catch(()=>{if(manual)setStatus("اضغطي على زر الأغنية مرة ثانية ❤️")})}
    function subscribe(){const ref=db.ref(path);ref.on("value",async snap=>{const incoming=snap.val();if(!incoming||!incoming.stage||typeof incoming.hugCount!=="number"){try{await ref.update({...defaultState,updatedAt:Date.now()})}catch(err){console.error("Room initialization failed",err)}return}const next=safeState(incoming);if(next.ikramoWantsHug&&next.imadoWantsHug&&next.stage!=="transitioning"&&next.stage!=="hugging"&&next.stage!=="completed"){beginTransition(next);return}state=next;render()});const presenceRef=db.ref(`${path}/presence`);presenceRef.on("value",snap=>{presenceData=snap.val()||{};renderPresence()});const myPresence=db.ref(`${path}/presence/${role}`);myPresence.onDisconnect().set(false);myPresence.set(true);db.ref(".info/connected").on("value",s=>setConnection(!!s.val(),s.val()?"متصلان معًا":"بانتظار الاتصال…"))}
    async function start(){if(!role){$("identity").classList.remove("hidden");$("app").classList.add("hidden");return}render();try{if(firebaseConfig.apiKey.startsWith("PASTE_"))throw new Error("Firebase config missing");if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);db=firebase.database();const cred=await firebase.auth().signInAnonymously();uid=cred.user.uid;const pRef=db.ref(`${path}/participants/${uid}`);const existing=(await pRef.once("value")).val();if(existing&&existing!==role)throw new Error("هذا الجهاز مرتبط بالهوية الأخرى");if(!existing)await pRef.set(role);subscribe();if(!timerInterval)timerInterval=setInterval(renderTimer,1000)}catch(err){console.error(err);setConnection(false,"تعذّر الاتصال بـ Firebase");let message="تأكد من نشر آخر نسخة من index.html.";if(err.code==="auth/operation-not-allowed")message="فعّل Anonymous من Firebase → Authentication → Sign-in method.";else if(err.code==="PERMISSION_DENIED"||err.code==="database/permission-denied")message="الصق قواعد Realtime Database الصحيحة ثم أعد تحميل الصفحة.";else if(err.message==="Firebase config missing")message="أضف إعدادات Firebase داخل CONFIGURATION.";else if(err.message==="هذا الجهاز مرتبط بالهوية الأخرى")message="هذا الجهاز محفوظ على هوية أخرى؛ اضغط تغيير واختر الهوية الصحيحة.";setStatus(`${message} <small style="display:block;margin-top:5px;opacity:.72">${err.code?`رمز الخطأ: ${err.code}`:""}</small>`);render()}}
    if(role){$("identity").classList.add("hidden");$("app").classList.remove("hidden");start()}else{$("identity").classList.remove("hidden")}
  </script>
